[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "island-mountain-authority-publisher"
version = "0.1.0"
description = "Approval-gated NOOA publisher for the Island Mountain authority campaign"
requires-python = ">=3.13,<3.14"
dependencies = [
  "nooa[cli]>=0.0.8,<0.1",
  "pydantic>=2.12,<3",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
im-publisher = "island_mountain_publisher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/island_mountain_publisher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
